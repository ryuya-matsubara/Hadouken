<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hadouken Battle</title>

<!-- Start image downloads as early as possible for near-instant display -->
<link rel="preconnect" href="https://github.com" crossorigin />
<link rel="preconnect" href="https://objects.githubusercontent.com" crossorigin />
<link rel="preload" as="image" href="https://github.com/user-attachments/assets/09c01193-501b-4ca5-9235-0097fd3836e2" />
<link rel="preload" as="image" href="https://github.com/user-attachments/assets/36978bae-bd81-44cc-9487-96ad4230588d" />
<link rel="preload" as="image" href="https://github.com/user-attachments/assets/1f96c6cb-cb0a-4d7a-80a0-7b5787a4c80b" />
<link rel="preload" as="image" href="https://github.com/user-attachments/assets/f796cd1b-2227-47fe-9a0b-067789965a70" />
<link rel="preload" as="image" href="https://github.com/user-attachments/assets/608b5c31-8e8c-46a1-9acb-ba4326a13377" />
<link rel="preload" as="image" href="https://github.com/user-attachments/assets/0f816811-6179-4c51-b4e0-28c16a7d4a83" />

<style>
  :root {
    --bg: #0e1116;
    --panel: #1a1f2b;
    --panel2: #232a38;
    --accent: #ff8a00;
    --p1: #ff6b6b;
    --p2: #4fc3f7;
    --text: #e8edf4;
    --muted: #8a94a6;
    --win: #7CFC00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: radial-gradient(circle at 50% -10%, #1c2536, var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  #app { width: 100%; max-width: 560px; }
  h1.title {
    margin: 0 0 12px;
    text-align: center;
    line-height: 0;
  }
  .title-img {
    display: block;
    width: 100%;
    max-width: 480px;
    height: auto;
    margin: 0 auto;
  }
  .topbar { display: flex; justify-content: flex-start; margin-bottom: 4px; min-height: 30px; }
  .home-btn {
    border: 1px solid #39424f;
    background: var(--panel2);
    color: var(--text);
    font-size: 0.82rem;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .home-btn:hover { background: #303a4d; }
  .turn-banner {
    text-align: center;
    font-size: 1rem;
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 14px;
    min-height: 1.4em;
  }

  .status-row { display: flex; gap: 12px; margin-bottom: 18px; }
  .player-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    border: 2px solid transparent;
    text-align: center;
  }
  .player-card.p1 { border-color: rgba(255,107,107,0.4); }
  .player-card.p2 { border-color: rgba(79,195,247,0.4); }
  .player-card.active { box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(255,138,0,0.4); }
  .player-name { font-weight: bold; font-size: 1rem; margin-bottom: 6px; }
  .p1 .player-name { color: var(--p1); }
  .p2 .player-name { color: var(--p2); }
  .energy { font-size: 1.3rem; letter-spacing: 2px; min-height: 1.4em; }
  .energy .empty { opacity: 0.18; }

  /* Screens */
  .screen { display: none; }
  .screen.show { display: block; }
  .card { background: var(--panel); border-radius: 14px; padding: 20px; }
  .prompt { text-align: center; font-size: 1.15rem; margin-bottom: 16px; font-weight: bold; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.action {
    padding: 0;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: var(--panel2);
    overflow: hidden;
    transition: transform 0.08s, box-shadow 0.15s;
    display: block;
    line-height: 0;
  }
  button.action .icon {
    display: block;
    width: 100%;
    height: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }
  button.action:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  button.action:active:not(:disabled) { transform: translateY(0); }
  button.action:disabled { opacity: 0.35; cursor: not-allowed; }

  .big-btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent), #ff5e00);
    color: #1a1206;
    margin-top: 8px;
  }
  .big-btn:hover { filter: brightness(1.08); }
  .pass-note { text-align: center; color: var(--muted); font-size: 0.95rem; margin: 8px 0 16px; }
  .ready-icons { display: flex; justify-content: center; gap: 30px; margin: 10px 0 18px; }
  .ready-icons .ready-fig { width: 110px; height: 150px; position: relative; }

  /* ============ BATTLE STAGE ============ */
  #battle .card { padding: 0; overflow: hidden; }
  .stage {
    position: relative;
    width: 100%;
    height: 340px;
    background:
      linear-gradient(180deg, #10233b 0%, #0b1424 55%, #060b14 100%);
    overflow: hidden;
  }
  .stage-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74px;
    background: linear-gradient(180deg, #2a2036, #171019);
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
  }
  .stage-ground::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,180,90,0.6), transparent);
  }

  .fighter-wrap {
    position: absolute; bottom: 70px; width: 150px; height: auto;
    transition: transform 0.18s;
  }
  .fighter-wrap.left { left: 0; }
  .fighter-wrap.right { right: 0; }
  .fighter-wrap.right.knockback { transform: translateX(18px); }
  .fighter-wrap.left.knockback  { transform: translateX(-18px); }

  .name-tag {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 0.72rem; font-weight: bold; white-space: nowrap;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .p1c .name-tag { color: var(--p1); }
  .p2c .name-tag { color: var(--p2); }

  .battle-log {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 1.05rem; font-weight: bold; min-height: 1.4em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    z-index: 30;
  }
  .countdown {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 5rem; font-weight: 900; color: #fff;
    text-shadow: 0 0 24px var(--accent); z-index: 40; pointer-events: none;
  }
  @keyframes cdPop { 0%{transform:translate(-50%,-50%) scale(0.3);opacity:0} 30%{transform:translate(-50%,-50%) scale(1.2);opacity:1} 100%{transform:translate(-50%,-50%) scale(1);opacity:0} }
  .countdown.pop { animation: cdPop 0.6s ease-out forwards; }

  /* screen flash + shake */
  .flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 25; pointer-events: none;
  }
  .flash.go { animation: flashAnim 0.35s ease-out; }
  @keyframes flashAnim { 0%{opacity:0.9} 100%{opacity:0} }
  @keyframes stageShake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,3px)} 40%{transform:translate(6px,-3px)} 60%{transform:translate(-4px,2px)} 80%{transform:translate(4px,-2px)} }
  .stage.shake { animation: stageShake 0.45s; }

  /* ---- image-based fighter ---- */
  .fighter-img {
    display: block;
    width: 100%; height: auto;   /* box hugs the image; no empty space above */
    filter: drop-shadow(0 6px 8px rgba(0,0,0,0.55));
  }
  /* idle bob */
  @keyframes idleBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  .fighter-wrap .fighter-img { animation: idleBob 1.7s ease-in-out infinite; }

  /* projectiles are now the provided effect images */
  .projectile {
    position:absolute; z-index:20; pointer-events:none;
    object-fit: contain;
  }
  .proj-blast { width:70px; height:70px; }
  .proj-hado  { width:110px; height:110px; }
  /* player 2's blast effect image reads a bit larger, so shrink it slightly */
  .proj-blast.from-p2 { width:56px; height:56px; }

  @keyframes travelR { from{left:110px} to{left:calc(100% - 150px)} }
  @keyframes travelL { from{right:110px} to{right:calc(100% - 150px)} }

  .impact {
    position:absolute; z-index:22; width:80px; height:80px; border-radius:50%;
    background: radial-gradient(circle, #fff 0%, #ffd36b 30%, rgba(255,120,0,0) 70%);
    transform: scale(0); pointer-events:none;
  }
  .impact.go { animation: impactAnim 0.5s ease-out forwards; }
  @keyframes impactAnim { 0%{transform:scale(0);opacity:1} 100%{transform:scale(2.4);opacity:0} }
  .clash {
    position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
    font-size:1.4rem; font-weight:900; color:#fff; z-index:23;
    text-shadow:0 0 12px #ffd36b; opacity:0;
  }
  .clash.go { animation: clashAnim 0.7s ease-out; }
  @keyframes clashAnim { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.4)} 40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1)} }

  @keyframes fallLeft  { 0%{transform:rotate(0) translateY(0);opacity:1} 100%{transform:rotate(-82deg) translateY(30px);opacity:0.75} }
  @keyframes fallRight { 0%{transform:rotate(0) translateY(0);opacity:1} 100%{transform:rotate(82deg) translateY(30px);opacity:0.75} }
  .fighter-wrap.ko .fighter-img { transform-origin: bottom center; }
  /* player 1 (left) falls backward to the left; player 2 (right) falls backward to the right */
  .fighter-wrap.left.ko .fighter-img  { animation: fallLeft 0.7s ease-in forwards; }
  .fighter-wrap.right.ko .fighter-img { animation: fallRight 0.7s ease-in forwards; }

  /* Result */
  #result .winner-text { text-align: center; font-size: 2rem; font-weight: bold; margin: 20px 0; }
  #result .winner-sub { text-align: center; color: var(--muted); margin-bottom: 20px; }

  /* Home / title screen */
  .home-card { text-align: center; }
  .home-lead { font-size: 1.05rem; line-height: 1.7; margin: 4px 0 18px; }
  .home-rules {
    text-align: left; margin: 20px auto 0; max-width: 440px;
    font-size: 0.82rem; color: var(--muted); line-height: 1.9;
    border-top: 1px solid #2a3140; padding-top: 14px;
  }
  .home-rules .hr-item b { color: var(--text); }
  .home-hero {
    display: block; height: auto;
    /* break out of the card's 20px padding so the image spans full width */
    width: calc(100% + 40px);
    margin: 18px -20px 4px;   /* cancel side padding; sits above the rules */
    border-top: 1px solid #2a3140;
    border-bottom: 1px solid #2a3140;
  }
  /* On the home screen, hide the in-game topbar and status row */
  #app.home-active #topbar,
  #app.home-active #statusRow,
  #app.home-active #turnBanner { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <button class="home-btn" id="homeBtn">ホーム</button>
  </div>
  <h1 class="title">
    <img class="title-img"
         src="https://github.com/user-attachments/assets/09c01193-501b-4ca5-9235-0097fd3836e2"
         alt="HADOUKEN BATTLE" fetchpriority="high" decoding="async" />
  </h1>

  <div class="turn-banner" id="turnBanner"></div>

  <div class="status-row" id="statusRow">
    <div class="player-card p1" id="card1">
      <div class="player-name">プレイヤー1</div>
      <div class="energy" id="energy1"></div>
    </div>
    <div class="player-card p2" id="card2">
      <div class="player-name">プレイヤー2</div>
      <div class="energy" id="energy2"></div>
    </div>
  </div>

  <!-- Home / title screen -->
  <div class="screen" id="home">
    <div class="card home-card">
      <p class="home-lead">プレイヤー1 と プレイヤー2 の読み合い対戦。<br>攻撃を当てた方が勝ち！</p>
      <button class="big-btn" id="startBtn">ゲームスタート</button>

      <img class="home-hero" id="homeHero"
           src="https://github.com/user-attachments/assets/36978bae-bd81-44cc-9487-96ad4230588d"
           alt="CHARGE / GUARD / BLAST / HADOUKEN" fetchpriority="high" decoding="async" />

      <div class="home-rules">
        <div class="hr-item"><b>チャージ</b>／エネルギーを1溜める（MAX3）</div>
        <div class="hr-item"><b>ブラスト</b>／エネルギー1消費。相手がチャージ中なら命中・ガードで防がれる</div>
        <div class="hr-item"><b>ガード</b>／ブラストを防ぐ（波動拳は防げない）</div>
        <div class="hr-item"><b>波動拳</b>／エネルギー3消費。波動拳同士は相殺、それ以外は必ず命中</div>
      </div>
    </div>
  </div>

  <!-- Pass device screen -->
  <div class="screen" id="passScreen">
    <div class="card">
      <div class="prompt" id="passPrompt"></div>
      <button class="big-btn" id="passBtn">アクションを選ぶ</button>
    </div>
  </div>

  <!-- Action selection screen -->
  <div class="screen" id="selectScreen">
    <div class="card">
      <div class="prompt" id="selectPrompt"></div>
      <div class="actions" id="actionButtons"></div>
    </div>
  </div>

  <!-- Ready / execute screen -->
  <div class="screen" id="readyScreen">
    <div class="card">
      <div class="prompt">両者のアクションが決定！</div>
      <div class="ready-icons">
        <div class="ready-fig" id="readyFig1"></div>
        <div class="ready-fig" id="readyFig2"></div>
      </div>
      <button class="big-btn" id="fightBtn">⚔️Battle⚔️</button>
    </div>
  </div>

  <!-- Battle scene -->
  <div class="screen" id="battle">
    <div class="card">
      <div class="stage" id="stage">
        <div class="stage-ground"></div>

        <div class="fighter-wrap left p1c" id="fw1">
          <div class="name-tag">プレイヤー1</div>
          <img class="fighter-img" id="fig1" alt="" decoding="async" />
        </div>

        <div class="fighter-wrap right p2c" id="fw2">
          <div class="name-tag">プレイヤー2</div>
          <img class="fighter-img" id="fig2" alt="" decoding="async" />
        </div>

        <div class="flash" id="flash"></div>
        <div class="countdown" id="countdown"></div>
        <div class="battle-log" id="battleLog"></div>
      </div>
    </div>
  </div>

  <!-- Result screen -->
  <div class="screen" id="result">
    <div class="card">
      <div class="winner-text" id="winnerText"></div>
      <div class="winner-sub" id="winnerSub"></div>
      <button class="big-btn" id="restartBtn">もう一度あそぶ</button>
    </div>
  </div>
</div>

<script>
"use strict";

const MAX_ENERGY = 3;

// Action button icons (images hosted on GitHub; referenced by URL because the
// build sandbox has no outbound network to vendor the binaries locally).
const TITLE_SRC = "https://github.com/user-attachments/assets/09c01193-501b-4ca5-9235-0097fd3836e2";
const HERO_SRC = "https://github.com/user-attachments/assets/36978bae-bd81-44cc-9487-96ad4230588d";
const ICON_SRC = {
  charge:   "https://github.com/user-attachments/assets/1f96c6cb-cb0a-4d7a-80a0-7b5787a4c80b",
  guard:    "https://github.com/user-attachments/assets/f796cd1b-2227-47fe-9a0b-067789965a70",
  blast:    "https://github.com/user-attachments/assets/608b5c31-8e8c-46a1-9acb-ba4326a13377",
  hadouken: "https://github.com/user-attachments/assets/0f816811-6179-4c51-b4e0-28c16a7d4a83",
};

// Battle-scene fighter images. Each player has pose images (stance/charge/
// guard/body) plus separate blast & hadouken effect images.
const FIGHTER = {
  1: {
    stance:   "https://github.com/user-attachments/assets/b0de241a-e247-4316-9dda-2898c341a0d8",
    charge:   "https://github.com/user-attachments/assets/3d7bb5dd-bf5a-404a-9a46-d7d8b56da7c4",
    guard:    "https://github.com/user-attachments/assets/ee94e173-bba3-42e5-9f1c-eb40554118f9",
    body:     "https://github.com/user-attachments/assets/12b1c385-262e-4dd0-8baf-69aca27bacdf",
    blastFx:  "https://github.com/user-attachments/assets/9d8d740c-6458-4f1a-abb0-89df325ca1bc",
    hadoFx:   "https://github.com/user-attachments/assets/ea0bc3d2-875c-4e1b-a017-13298d5e7e03",
  },
  2: {
    stance:   "https://github.com/user-attachments/assets/78f92c6c-7dc7-400e-b08a-0025be5a4b5f",
    charge:   "https://github.com/user-attachments/assets/6deb9b00-2a2c-4ff8-808f-725f549c0923",
    guard:    "https://github.com/user-attachments/assets/1b26b257-eee8-4cf2-8289-5725fb1ef40c",
    body:     "https://github.com/user-attachments/assets/064b9b06-ba73-483e-92f2-89827aacde14",
    blastFx:  "https://github.com/user-attachments/assets/5ec8d95c-eb37-4974-9c63-96f975bcf817",
    hadoFx:   "https://github.com/user-attachments/assets/f11cb92c-f0cc-434b-b34f-9a4eab1d2a20",
  },
};
// pose image shown for each action (idle/countdown uses "stance")
function poseSrc(player, key) {
  const f = FIGHTER[player];
  if (key === "charge") return f.charge;
  if (key === "guard")  return f.guard;
  if (key === "blast" || key === "hadouken") return f.body;
  return f.stance;
}

// Preload every image up-front and KEEP the Image objects alive in a cache so
// the browser holds the decoded bitmaps in memory. This removes the lag when a
// pose is swapped and ensures short-lived projectile effects render instantly.
const IMG_CACHE = {};
(function preloadImages() {
  const fighterImgs = [1, 2].flatMap((p) => Object.values(FIGHTER[p]));
  [TITLE_SRC, HERO_SRC, ...Object.values(ICON_SRC), ...fighterImgs]
    .forEach((src) => {
      const im = new Image();
      im.decoding = "async";
      im.src = src;
      IMG_CACHE[src] = im;
    });
})();

const ICONS = Object.fromEntries(
  Object.entries(ICON_SRC).map(([key, src]) =>
    [key, `<img class="icon" src="${src}" alt="" decoding="async" />`])
);

const ACTIONS = {
  charge:   { key: "charge",   label: "チャージ", cost: 0, costLabel: "エネルギー +1" },
  blast:    { key: "blast",    label: "ブラスト", cost: 1, costLabel: "エネルギー -1" },
  guard:    { key: "guard",    label: "ガード",   cost: 0, costLabel: "消費なし" },
  hadouken: { key: "hadouken", label: "波動拳",   cost: 3, costLabel: "エネルギー -3" },
};

let state;
let battleToken = 0; // incremented whenever a battle should be cancelled (e.g. Home)

function initState() {
  state = { energy: { 1: 0, 2: 0 }, turn: 1, currentPlayer: 1, choice: { 1: null, 2: null } };
}

// Show the home / title screen, cancelling any running battle.
function goHome() {
  battleToken++;          // invalidates any in-flight runBattle()
  initState();
  setActiveCard(0);
  $("turnBanner").textContent = "";
  showScreen("home");
}

// Begin a fresh game from the home screen.
function startGame() {
  battleToken++;
  initState();
  startTurn();
}

const $ = (id) => document.getElementById(id);
const screens = ["home", "passScreen", "selectScreen", "readyScreen", "battle", "result"];
function showScreen(id) {
  screens.forEach((s) => $(s).classList.toggle("show", s === id));
  // toggle home layout (hide in-game chrome on the title screen)
  $("app").classList.toggle("home-active", id === "home");
}

function renderEnergy() {
  for (const p of [1, 2]) {
    const n = state.energy[p];
    let html = "";
    for (let i = 0; i < MAX_ENERGY; i++) html += `<span class="${i < n ? "" : "empty"}">🟠</span>`;
    $("energy" + p).innerHTML = html;
  }
}

function setActiveCard(player) {
  $("card1").classList.toggle("active", player === 1);
  $("card2").classList.toggle("active", player === 2);
}

// ---- Flow ----
function startTurn() {
  state.choice = { 1: null, 2: null };
  state.currentPlayer = 1;
  renderEnergy();
  $("turnBanner").textContent = `ターン ${state.turn}`;
  goToPass(1);
}

function goToPass(player) {
  state.currentPlayer = player;
  setActiveCard(player);
  $("passPrompt").textContent = `プレイヤー${player} の番です`;
  $("passBtn").textContent = `プレイヤー${player}：アクションを選ぶ`;
  showScreen("passScreen");
}

function goToSelect(player) {
  setActiveCard(player);
  $("selectPrompt").textContent = `プレイヤー${player}：アクションを選択`;
  const container = $("actionButtons");
  container.innerHTML = "";
  for (const key of ["charge", "blast", "guard", "hadouken"]) {
    const a = ACTIONS[key];
    const btn = document.createElement("button");
    btn.className = "action";
    const canAfford = state.energy[player] >= a.cost;
    btn.disabled = !canAfford;
    btn.title = `${a.label}（${a.costLabel}）`;   // keep info on hover / for a11y
    btn.setAttribute("aria-label", a.label);
    btn.innerHTML = ICONS[key];                    // image-only button
    if (canAfford) btn.addEventListener("click", () => chooseAction(player, key));
    container.appendChild(btn);
  }
  showScreen("selectScreen");
}

function chooseAction(player, key) {
  state.choice[player] = key;
  if (player === 1) {
    goToPass(2);
  } else {
    setActiveCard(0);
    goToReady();
  }
}

// NEW: an execute/ready screen between P2's choice and the battle scene
function goToReady() {
  // show neutral stance silhouettes only (actions stay secret until the battle)
  $("readyFig1").innerHTML = readySilhouette(1);
  $("readyFig2").innerHTML = readySilhouette(2);
  showScreen("readyScreen");
}

function readySilhouette(player) {
  // P2 images are already drawn facing left, so no flip needed
  return `<img src="${poseSrc(player, "stance")}" alt=""
    style="width:100%;height:100%;object-fit:contain;object-position:bottom center;filter:brightness(0.15) drop-shadow(0 0 6px rgba(0,0,0,0.6));" />`;
}

// ---- Battle resolution ----
function resolve(a1, a2) {
  if (a1 === "hadouken" && a2 === "hadouken") return { result: "continue", kind: "clash-hado", reason: "波動拳が激突！相殺！" };
  if (a1 === "hadouken") return { result: "p1", kind: "hado", reason: "プレイヤー1の波動拳が炸裂！" };
  if (a2 === "hadouken") return { result: "p2", kind: "hado", reason: "プレイヤー2の波動拳が炸裂！" };

  if (a1 === "blast" && a2 === "blast") return { result: "continue", kind: "clash-blast", reason: "ブラストが激突！相殺！" };
  if (a1 === "blast") {
    if (a2 === "charge") return { result: "p1", kind: "blast", reason: "プレイヤー1のブラストが命中！" };
    if (a2 === "guard")  return { result: "continue", kind: "blocked", by: 2, reason: "プレイヤー2がガードで防いだ！" };
  }
  if (a2 === "blast") {
    if (a1 === "charge") return { result: "p2", kind: "blast", reason: "プレイヤー2のブラストが命中！" };
    if (a1 === "guard")  return { result: "continue", kind: "blocked", by: 1, reason: "プレイヤー1がガードで防いだ！" };
  }
  return { result: "continue", kind: "none", reason: "決着つかず。次のターンへ！" };
}

function applyCosts() {
  for (const p of [1, 2]) {
    const key = state.choice[p];
    if (key === "charge") state.energy[p] = Math.min(MAX_ENERGY, state.energy[p] + 1);
    else state.energy[p] = Math.max(0, state.energy[p] - ACTIONS[key].cost);
  }
}

// ---- Battle scene (rich choreography) ----
function delay(ms) { return new Promise((r) => setTimeout(r, ms)); }

// Resolve once the given image URL is fully loaded (uses the preload cache).
// Guarantees pose swaps and short-lived effect images are painted immediately.
function ensureLoaded(src, timeoutMs = 2000) {
  const im = IMG_CACHE[src] || (IMG_CACHE[src] = Object.assign(new Image(), { src }));
  if (im.complete && im.naturalWidth > 0) return Promise.resolve();
  return new Promise((resolve) => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    im.addEventListener("load", finish, { once: true });
    im.addEventListener("error", finish, { once: true });
    setTimeout(finish, timeoutMs); // never block the battle if the network is slow
  });
}

// Preload every image the upcoming battle will use, before it starts.
function preloadForBattle(a1, a2) {
  const urls = new Set([poseSrc(1, a1), poseSrc(2, a2)]);
  if (a1 === "blast") urls.add(FIGHTER[1].blastFx);
  if (a1 === "hadouken") urls.add(FIGHTER[1].hadoFx);
  if (a2 === "blast") urls.add(FIGHTER[2].blastFx);
  if (a2 === "hadouken") urls.add(FIGHTER[2].hadoFx);
  return Promise.all([...urls].map(ensureLoaded));
}

function shakeStage() {
  const s = $("stage");
  s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
}
function flashStage() {
  const f = $("flash");
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}

// Vertical center where projectiles should travel (roughly the fighters'
// hand height, measured from the stage floor).
const PROJECTILE_CENTER = 150;

function spawnProjectile(fromPlayer, kind) {
  const stage = $("stage");
  const el = document.createElement("img");
  const isHado = kind === "hadouken";
  el.className = "projectile " + (isHado ? "proj-hado" : "proj-blast");
  if (fromPlayer === 2) el.classList.add("from-p2");
  el.src = isHado ? FIGHTER[fromPlayer].hadoFx : FIGHTER[fromPlayer].blastFx;
  const goRight = fromPlayer === 1;
  const size = isHado ? 110 : (fromPlayer === 2 ? 56 : 70);
  // align the projectile's CENTER with the fighters' hands
  el.style.bottom = (PROJECTILE_CENTER - size / 2) + "px";
  el.style.animation = `${goRight ? "travelR" : "travelL"} 0.6s linear forwards`;
  stage.appendChild(el);
  return el;
}

function impactAt(rightSide) {
  const stage = $("stage");
  const el = document.createElement("div");
  el.className = "impact go";
  el.style.bottom = (PROJECTILE_CENTER - 40) + "px"; // impact is 80px tall
  if (rightSide) el.style.right = "70px"; else el.style.left = "70px";
  stage.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function clashText(txt) {
  const c = $("clash") || (() => {
    const e = document.createElement("div"); e.id = "clash"; e.className = "clash"; $("stage").appendChild(e); return e;
  })();
  c.textContent = txt;
  c.classList.remove("go"); void c.offsetWidth; c.classList.add("go");
}

function resetStage() {
  const stage = $("stage");
  // remove any leftover dynamic elements from a previous turn
  stage.querySelectorAll(".projectile, .impact").forEach((el) => el.remove());
  const clash = $("clash");
  if (clash) clash.remove();
  // clear lingering animation classes
  stage.classList.remove("shake");
  $("flash").classList.remove("go");
  $("fw1").className = "fighter-wrap left p1c";
  $("fw2").className = "fighter-wrap right p2c";
  // reset both fighters to their neutral stance pose
  $("fig1").src = poseSrc(1, "stance");
  $("fig2").src = poseSrc(2, "stance");
  $("battleLog").textContent = "";
  $("countdown").textContent = "";
  // force reflow so removed animation classes fully reset before replay
  void stage.offsetWidth;
}

async function runBattle() {
  const myToken = battleToken;           // snapshot; if it changes, this battle was cancelled
  const cancelled = () => myToken !== battleToken;

  const a1 = state.choice[1], a2 = state.choice[2];
  showScreen("battle");
  resetStage();

  const fig1 = $("fig1"), fig2 = $("fig2");
  const cd = $("countdown");

  // Make sure every image this battle needs is decoded before we start,
  // so pose swaps have no lag and effect images always render.
  await preloadForBattle(a1, a2);
  if (cancelled()) return;

  // Countdown 3-2-1-FIGHT
  for (const t of ["3", "2", "1", "FIGHT!"]) {
    cd.textContent = t;
    cd.classList.remove("pop"); void cd.offsetWidth; cd.classList.add("pop");
    await delay(600);
    if (cancelled()) return;
  }
  cd.textContent = "";

  // Reveal stances (swap to each action's pose image)
  fig1.src = poseSrc(1, a1);
  fig2.src = poseSrc(2, a2);
  $("battleLog").textContent = `${ACTIONS[a1].label}　VS　${ACTIONS[a2].label}`;
  await delay(700);
  if (cancelled()) return;

  const outcome = resolve(a1, a2);
  applyCosts();
  renderEnergy();

  await playChoreography(a1, a2, outcome);
  if (cancelled()) return;

  $("battleLog").textContent = outcome.reason;
  await delay(1300);
  if (cancelled()) return;
  finishBattle(outcome);
}

async function playChoreography(a1, a2, outcome) {
  const kind = outcome.kind;

  if (kind === "clash-hado" || kind === "clash-blast") {
    // both fire, meet in the middle, explode
    const proj = kind === "clash-hado" ? "hadouken" : "blast";
    const p1 = spawnProjectile(1, proj), p2 = spawnProjectile(2, proj);
    // shorten travel so they meet mid-stage
    p1.style.animationDuration = "0.4s"; p2.style.animationDuration = "0.4s";
    p1.style.animationName = "travelRhalf"; p2.style.animationName = "travelLhalf";
    injectHalfKeyframes();
    await delay(400);
    p1.remove(); p2.remove();
    impactMid(); clashText("相殺！"); flashStage(); shakeStage();
    await delay(500);
    return;
  }

  if (kind === "hado" || kind === "blast") {
    const attacker = outcome.result === "p1" ? 1 : 2;
    const proj = kind === "hado" ? "hadouken" : "blast";
    const el = spawnProjectile(attacker, proj);
    await delay(600);
    el.remove();
    // hit the loser
    const rightSideHit = attacker === 1; // opponent is on the right
    impactAt(rightSideHit);
    flashStage(); shakeStage();
    const loserWrap = attacker === 1 ? $("fw2") : $("fw1");
    loserWrap.classList.add("knockback");
    await delay(350);
    loserWrap.classList.add("ko");
    await delay(500);
    return;
  }

  if (kind === "blocked") {
    // attacker fires, defender's shield flares
    const attacker = outcome.by === 1 ? 2 : 1;
    const el = spawnProjectile(attacker, "blast");
    await delay(600);
    el.remove();
    const rightSideHit = attacker === 1;
    impactAt(rightSideHit);
    clashText("GUARD!"); flashStage(); shakeStage();
    await delay(500);
    return;
  }

  // no interaction (e.g. charge vs charge, guard vs guard, charge vs guard)
  clashText("…");
  await delay(500);
}

function impactMid() {
  const stage = $("stage");
  const el = document.createElement("div");
  el.className = "impact go";
  el.style.bottom = (PROJECTILE_CENTER - 60) + "px"; // mid impact is 120px tall
  el.style.left = "50%"; el.style.transform = "translateX(-50%)";
  el.style.width = "120px"; el.style.height = "120px";
  stage.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

let halfInjected = false;
function injectHalfKeyframes() {
  if (halfInjected) return;
  const s = document.createElement("style");
  s.textContent = `
    @keyframes travelRhalf { from{left:96px} to{left:calc(50% - 24px)} }
    @keyframes travelLhalf { from{right:96px} to{right:calc(50% - 24px)} }`;
  document.head.appendChild(s);
  halfInjected = true;
}

function finishBattle(outcome) {
  if (outcome.result === "continue") { state.turn++; startTurn(); return; }
  showScreen("result");
  setActiveCard(0);
  $("turnBanner").textContent = "";
  const winner = outcome.result === "p1" ? 1 : 2;
  $("winnerText").textContent = `🏆 プレイヤー${winner} の勝ち！`;
  $("winnerText").style.color = winner === 1 ? "var(--p1)" : "var(--p2)";
  $("winnerSub").textContent = outcome.reason;
}

// ---- Events ----
$("passBtn").addEventListener("click", () => goToSelect(state.currentPlayer));
$("fightBtn").addEventListener("click", () => runBattle());
$("startBtn").addEventListener("click", () => startGame());
$("restartBtn").addEventListener("click", () => goHome());
$("homeBtn").addEventListener("click", () => goHome());

// ---- Start ----
initState();
goHome();
</script>
</body>
</html>
