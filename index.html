<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hadouken Battle</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #1a1f2b;
    --panel2: #232a38;
    --accent: #ff8a00;
    --p1: #4fc3f7;
    --p2: #ff6b6b;
    --text: #e8edf4;
    --muted: #8a94a6;
    --win: #7CFC00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    background: radial-gradient(circle at 50% -10%, #1c2536, var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  #app { width: 100%; max-width: 560px; }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin: 0 0 12px;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--p1), var(--accent), var(--p2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .topbar { display: flex; justify-content: flex-start; margin-bottom: 4px; min-height: 30px; }
  .home-btn {
    border: 1px solid #39424f;
    background: var(--panel2);
    color: var(--text);
    font-size: 0.82rem;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .home-btn:hover { background: #303a4d; }
  .turn-banner {
    text-align: center;
    font-size: 1rem;
    color: var(--accent);
    font-weight: bold;
    margin-bottom: 14px;
    min-height: 1.4em;
  }

  .status-row { display: flex; gap: 12px; margin-bottom: 18px; }
  .player-card {
    flex: 1;
    background: var(--panel);
    border-radius: 12px;
    padding: 12px;
    border: 2px solid transparent;
    text-align: center;
  }
  .player-card.p1 { border-color: rgba(79,195,247,0.4); }
  .player-card.p2 { border-color: rgba(255,107,107,0.4); }
  .player-card.active { box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(255,138,0,0.4); }
  .player-name { font-weight: bold; font-size: 1rem; margin-bottom: 6px; }
  .p1 .player-name { color: var(--p1); }
  .p2 .player-name { color: var(--p2); }
  .energy { font-size: 1.3rem; letter-spacing: 2px; min-height: 1.4em; }
  .energy .empty { opacity: 0.18; }

  /* Screens */
  .screen { display: none; }
  .screen.show { display: block; }
  .card { background: var(--panel); border-radius: 14px; padding: 20px; }
  .prompt { text-align: center; font-size: 1.15rem; margin-bottom: 16px; font-weight: bold; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button.action {
    padding: 14px 10px 12px;
    font-size: 1.05rem;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: var(--panel2);
    color: var(--text);
    transition: transform 0.08s, background 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  button.action .icon { width: 46px; height: 46px; }
  button.action .cost { font-size: 0.72rem; color: var(--muted); }
  button.action:hover:not(:disabled) { background: #303a4d; transform: translateY(-2px); }
  button.action:active:not(:disabled) { transform: translateY(0); }
  button.action:disabled { opacity: 0.35; cursor: not-allowed; }

  .big-btn {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(90deg, var(--accent), #ff5e00);
    color: #1a1206;
    margin-top: 8px;
  }
  .big-btn:hover { filter: brightness(1.08); }
  .pass-note { text-align: center; color: var(--muted); font-size: 0.95rem; margin: 8px 0 16px; }
  .ready-icons { display: flex; justify-content: center; gap: 40px; margin: 10px 0 18px; }
  .ready-icons .ready-fig { width: 90px; height: 120px; position: relative; }

  /* ============ BATTLE STAGE ============ */
  #battle .card { padding: 0; overflow: hidden; }
  .stage {
    position: relative;
    width: 100%;
    height: 300px;
    background:
      linear-gradient(180deg, #10233b 0%, #0b1424 55%, #060b14 100%);
    overflow: hidden;
  }
  .stage-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 74px;
    background: linear-gradient(180deg, #2a2036, #171019);
    box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);
  }
  .stage-ground::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(255,180,90,0.6), transparent);
  }

  .fighter-wrap {
    position: absolute; bottom: 60px; width: 96px; height: 150px;
    transition: transform 0.18s;
  }
  .fighter-wrap.left { left: 46px; }
  .fighter-wrap.right { right: 46px; transform: scaleX(-1); }
  .fighter-wrap.right.knockback { transform: scaleX(-1) translateX(-18px); }
  .fighter-wrap.left.knockback  { transform: translateX(-18px); }

  .name-tag {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 0.72rem; font-weight: bold; white-space: nowrap;
  }
  .fighter-wrap.right .name-tag { transform: translateX(-50%) scaleX(-1); }
  .p1c .name-tag { color: var(--p1); }
  .p2c .name-tag { color: var(--p2); }

  .battle-log {
    position: absolute; left: 0; right: 0; bottom: 8px; text-align: center;
    font-size: 1.05rem; font-weight: bold; min-height: 1.4em;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    z-index: 30;
  }
  .countdown {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 5rem; font-weight: 900; color: #fff;
    text-shadow: 0 0 24px var(--accent); z-index: 40; pointer-events: none;
  }
  @keyframes cdPop { 0%{transform:translate(-50%,-50%) scale(0.3);opacity:0} 30%{transform:translate(-50%,-50%) scale(1.2);opacity:1} 100%{transform:translate(-50%,-50%) scale(1);opacity:0} }
  .countdown.pop { animation: cdPop 0.6s ease-out forwards; }

  /* screen flash + shake */
  .flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 25; pointer-events: none;
  }
  .flash.go { animation: flashAnim 0.35s ease-out; }
  @keyframes flashAnim { 0%{opacity:0.9} 100%{opacity:0} }
  @keyframes stageShake { 0%,100%{transform:translate(0,0)} 20%{transform:translate(-6px,3px)} 40%{transform:translate(6px,-3px)} 60%{transform:translate(-4px,2px)} 80%{transform:translate(4px,-2px)} }
  .stage.shake { animation: stageShake 0.45s; }

  /* ---- fighter body (CSS drawn) ---- */
  .fig { position: absolute; inset: 0; }
  .fig .part { position: absolute; }
  .torso {
    width: 34px; height: 44px; left: 31px; top: 46px;
    border-radius: 14px 14px 10px 10px;
  }
  .head {
    width: 30px; height: 30px; left: 33px; top: 20px; border-radius: 50%;
    border: 3px solid rgba(0,0,0,0.25);
  }
  .head::after {
    content:""; position:absolute; left:6px; top:8px; width:14px; height:6px;
    background: rgba(0,0,0,0.45); border-radius: 3px;
  }
  .belt { width: 34px; height: 7px; left: 31px; top: 84px; background:#1c1c22; border-radius:3px; }
  .arm {
    width: 12px; height: 34px; border-radius: 8px; top: 50px;
    transform-origin: top center;
  }
  .arm.back { left: 24px; }
  .arm.front { left: 60px; }
  .leg { width: 13px; height: 40px; border-radius: 7px; top: 90px; transform-origin: top center; }
  .leg.back { left: 30px; }
  .leg.front { left: 46px; }

  .p1c .torso, .p1c .arm, .p1c .leg { background: linear-gradient(180deg,#6fd0ff,#2e9fe0); }
  .p1c .head { background: #ffe0bd; }
  .p2c .torso, .p2c .arm, .p2c .leg { background: linear-gradient(180deg,#ff8f8f,#e04d4d); }
  .p2c .head { background: #ffe0bd; }

  /* idle bob */
  @keyframes idleBob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
  .fighter-wrap .fig { animation: idleBob 1.6s ease-in-out infinite; }

  /* stance: charge (both fists pulled, glowing aura) */
  .pose-charge .arm.front { transform: rotate(150deg); }
  .pose-charge .arm.back  { transform: rotate(150deg); }
  .aura {
    position:absolute; left:50%; top:64px; transform:translateX(-50%);
    width:70px; height:70px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,170,40,0.55), rgba(255,170,40,0));
    animation: auraPulse 0.5s ease-in-out infinite; display:none;
  }
  .pose-charge .aura { display:block; }
  @keyframes auraPulse { 0%,100%{transform:translateX(-50%) scale(0.85);opacity:0.6} 50%{transform:translateX(-50%) scale(1.15);opacity:1} }
  .spark {
    position:absolute; width:6px; height:6px; border-radius:50%; background:#ffd36b;
    box-shadow:0 0 8px #ffb03a;
  }

  /* stance: guard (both arms up crossed) */
  .pose-guard .arm.front { transform: rotate(200deg) translateY(-4px); left:52px; }
  .pose-guard .arm.back  { transform: rotate(160deg) translateY(-4px); left:30px; }
  .shield {
    position:absolute; left:50%; top:34px; transform:translateX(-50%); z-index:5;
    width:80px; height:96px; border-radius:44px;
    border:3px solid #baf0ff;
    background: radial-gradient(circle, rgba(127,220,255,0.72), rgba(90,190,255,0.5));
    box-shadow:0 0 22px rgba(127,220,255,0.9), inset 0 0 18px rgba(255,255,255,0.5);
    display:none;
  }
  .pose-guard .shield { display:block; animation: shieldFlick 0.4s ease-in-out infinite alternate; }
  @keyframes shieldFlick { from{opacity:0.88} to{opacity:1} }

  /* stance: blast (front arm thrust) */
  .pose-blast .arm.front { transform: rotate(95deg); left:58px; top:52px; }
  .pose-blast .leg.front { transform: rotate(20deg); }
  .pose-blast .leg.back  { transform: rotate(-14deg); }

  /* stance: hadouken (deep stance, both palms forward) */
  .pose-hadouken .arm.front { transform: rotate(92deg); left:60px; top:54px; }
  .pose-hadouken .arm.back  { transform: rotate(70deg); left:40px; top:56px; }
  .pose-hadouken .leg.front { transform: rotate(28deg); }
  .pose-hadouken .leg.back  { transform: rotate(-24deg); }
  .pose-hadouken .torso { transform: translateY(6px); }

  /* projectiles */
  .projectile { position:absolute; z-index:20; pointer-events:none; }
  .blast-ball {
    width:24px; height:24px; border-radius:50%;
    background: radial-gradient(circle at 40% 40%, #fff, #ffd36b 40%, #ff7b00 80%);
    box-shadow: 0 0 16px #ff9d3c, 0 0 30px #ff7b00;
  }
  .hado-ball {
    width:46px; height:46px; border-radius:50%;
    background: radial-gradient(circle at 40% 40%, #ffffff, #9be7ff 35%, #2aa8ff 70%, #1567d6 100%);
    box-shadow: 0 0 26px #46b6ff, 0 0 50px #2aa8ff;
  }
  .hado-ball::after {
    content:""; position:absolute; inset:-8px; border-radius:50%;
    border:3px solid rgba(160,225,255,0.6); animation: ring 0.5s linear infinite;
  }
  @keyframes ring { from{transform:rotate(0)} to{transform:rotate(360deg)} }

  @keyframes travelR { from{left:96px} to{left:calc(100% - 120px)} }
  @keyframes travelL { from{right:96px} to{right:calc(100% - 120px)} }

  .impact {
    position:absolute; z-index:22; width:80px; height:80px; border-radius:50%;
    background: radial-gradient(circle, #fff 0%, #ffd36b 30%, rgba(255,120,0,0) 70%);
    transform: scale(0); pointer-events:none;
  }
  .impact.go { animation: impactAnim 0.5s ease-out forwards; }
  @keyframes impactAnim { 0%{transform:scale(0);opacity:1} 100%{transform:scale(2.4);opacity:0} }
  .clash {
    position:absolute; top:44%; left:50%; transform:translate(-50%,-50%);
    font-size:1.4rem; font-weight:900; color:#fff; z-index:23;
    text-shadow:0 0 12px #ffd36b; opacity:0;
  }
  .clash.go { animation: clashAnim 0.7s ease-out; }
  @keyframes clashAnim { 0%{opacity:0;transform:translate(-50%,-50%) scale(0.4)} 40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)} 100%{opacity:0;transform:translate(-50%,-50%) scale(1)} }

  @keyframes fall { 0%{transform:rotate(0)} 100%{transform:rotate(-82deg) translateY(20px)} }
  .fighter-wrap.left.ko .fig  { animation: fall 0.7s ease-in forwards; }
  .fighter-wrap.right.ko .fig { animation: fall 0.7s ease-in forwards; }

  /* Result */
  #result .winner-text { text-align: center; font-size: 2rem; font-weight: bold; margin: 20px 0; }
  #result .winner-sub { text-align: center; color: var(--muted); margin-bottom: 20px; }

  /* Home / title screen */
  .home-card { text-align: center; }
  .home-lead { font-size: 1.05rem; line-height: 1.7; margin: 4px 0 18px; }
  .home-rules {
    text-align: left; margin: 20px auto 0; max-width: 440px;
    font-size: 0.82rem; color: var(--muted); line-height: 1.9;
    border-top: 1px solid #2a3140; padding-top: 14px;
  }
  .home-rules .hr-item b { color: var(--text); }
  .home-hero {
    display: block; width: 100%; height: auto; margin: 20px auto 0;
    border-radius: 12px; border: 1px solid #2a3140;
  }
  /* On the home screen, hide the in-game topbar and status row */
  #app.home-active #topbar,
  #app.home-active #statusRow,
  #app.home-active #turnBanner { display: none; }
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar">
    <button class="home-btn" id="homeBtn">ホーム</button>
  </div>
  <h1>⚡ HADOUKEN BATTLE ⚡</h1>

  <div class="turn-banner" id="turnBanner"></div>

  <div class="status-row" id="statusRow">
    <div class="player-card p1" id="card1">
      <div class="player-name">プレイヤー1</div>
      <div class="energy" id="energy1"></div>
    </div>
    <div class="player-card p2" id="card2">
      <div class="player-name">プレイヤー2</div>
      <div class="energy" id="energy2"></div>
    </div>
  </div>

  <!-- Home / title screen -->
  <div class="screen" id="home">
    <div class="card home-card">
      <p class="home-lead">プレイヤー1 と プレイヤー2 の読み合い対戦。<br>攻撃を当てた方が勝ち！</p>
      <button class="big-btn" id="startBtn">ゲームスタート</button>

      <div class="home-rules">
        <div class="hr-item"><b>チャージ</b>／エネルギーを1溜める（MAX3）</div>
        <div class="hr-item"><b>ブラスト</b>／エネルギー1消費。相手がチャージ中なら命中・ガードで防がれる</div>
        <div class="hr-item"><b>ガード</b>／ブラストを防ぐ（波動拳は防げない）</div>
        <div class="hr-item"><b>波動拳</b>／エネルギー3消費。波動拳同士は相殺、それ以外は必ず命中</div>
      </div>

      <img class="home-hero" id="homeHero"
           src="https://github.com/user-attachments/assets/36978bae-bd81-44cc-9487-96ad4230588d"
           alt="CHARGE / GUARD / BLAST / HADOUKEN" loading="lazy" />
    </div>
  </div>

  <!-- Pass device screen -->
  <div class="screen" id="passScreen">
    <div class="card">
      <div class="prompt" id="passPrompt"></div>
      <button class="big-btn" id="passBtn">アクションを選ぶ</button>
    </div>
  </div>

  <!-- Action selection screen -->
  <div class="screen" id="selectScreen">
    <div class="card">
      <div class="prompt" id="selectPrompt"></div>
      <div class="actions" id="actionButtons"></div>
    </div>
  </div>

  <!-- Ready / execute screen -->
  <div class="screen" id="readyScreen">
    <div class="card">
      <div class="prompt">両者のアクションが決定！</div>
      <div class="ready-icons">
        <div class="ready-fig" id="readyFig1"></div>
        <div class="ready-fig" id="readyFig2"></div>
      </div>
      <button class="big-btn" id="fightBtn">⚔️Battle⚔️</button>
    </div>
  </div>

  <!-- Battle scene -->
  <div class="screen" id="battle">
    <div class="card">
      <div class="stage" id="stage">
        <div class="stage-ground"></div>

        <div class="fighter-wrap left p1c" id="fw1">
          <div class="name-tag">プレイヤー1</div>
          <div class="fig" id="fig1">
            <div class="aura"></div>
            <div class="shield"></div>
            <div class="part arm back"></div>
            <div class="part leg back"></div>
            <div class="part leg front"></div>
            <div class="part torso"></div>
            <div class="part belt"></div>
            <div class="part head"></div>
            <div class="part arm front"></div>
          </div>
        </div>

        <div class="fighter-wrap right p2c" id="fw2">
          <div class="name-tag">プレイヤー2</div>
          <div class="fig" id="fig2">
            <div class="aura"></div>
            <div class="shield"></div>
            <div class="part arm back"></div>
            <div class="part leg back"></div>
            <div class="part leg front"></div>
            <div class="part torso"></div>
            <div class="part belt"></div>
            <div class="part head"></div>
            <div class="part arm front"></div>
          </div>
        </div>

        <div class="flash" id="flash"></div>
        <div class="countdown" id="countdown"></div>
        <div class="battle-log" id="battleLog"></div>
      </div>
    </div>
  </div>

  <!-- Result screen -->
  <div class="screen" id="result">
    <div class="card">
      <div class="winner-text" id="winnerText"></div>
      <div class="winner-sub" id="winnerSub"></div>
      <button class="big-btn" id="restartBtn">もう一度あそぶ</button>
    </div>
  </div>
</div>

<script>
"use strict";

const MAX_ENERGY = 3;

// SVG icons for the 4 actions (drawn, not emoji)
const ICONS = {
  charge: `<svg class="icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="24" cy="24" r="16" fill="url(#cg)"/>
    <path d="M25 12 L17 26 h6 l-2 10 10-14 h-6 z" fill="#fff8e0"/>
    <defs><radialGradient id="cg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffe6a8"/><stop offset="60%" stop-color="#ff9d3c"/><stop offset="100%" stop-color="#e06a00"/>
    </radialGradient></defs></svg>`,
  blast: `<svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <circle cx="22" cy="24" r="10" fill="url(#bg)"/>
    <path d="M32 24 h12 M31 18 l10 -5 M31 30 l10 5" stroke="#ffb14a" stroke-width="3" stroke-linecap="round"/>
    <defs><radialGradient id="bg" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#fff"/><stop offset="45%" stop-color="#ffd36b"/><stop offset="100%" stop-color="#ff7b00"/>
    </radialGradient></defs></svg>`,
  guard: `<svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 5 L40 11 V24 C40 34 33 40 24 44 C15 40 8 34 8 24 V11 Z" fill="url(#gg)" stroke="#bfefff" stroke-width="2"/>
    <path d="M24 5 L40 11 V24 C40 34 33 40 24 44 Z" fill="rgba(255,255,255,0.12)"/>
    <path d="M17 24 l5 5 l9 -11" stroke="#eaffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fd0ff"/><stop offset="100%" stop-color="#2e7fd0"/>
    </linearGradient></defs></svg>`,
  hadouken: `<svg class="icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <circle cx="24" cy="24" r="13" fill="url(#hg)"/>
    <circle cx="24" cy="24" r="17" fill="none" stroke="#a0e1ff" stroke-width="2" opacity="0.7"/>
    <path d="M24 9 a15 15 0 0 1 13 8" stroke="#dff4ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M24 39 a15 15 0 0 1 -13 -8" stroke="#dff4ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <defs><radialGradient id="hg" cx="40%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#9be7ff"/><stop offset="100%" stop-color="#1567d6"/>
    </radialGradient></defs></svg>`,
};

const ACTIONS = {
  charge:   { key: "charge",   label: "チャージ", cost: 0, costLabel: "エネルギー +1" },
  blast:    { key: "blast",    label: "ブラスト", cost: 1, costLabel: "エネルギー -1" },
  guard:    { key: "guard",    label: "ガード",   cost: 0, costLabel: "消費なし" },
  hadouken: { key: "hadouken", label: "波動拳",   cost: 3, costLabel: "エネルギー -3" },
};

let state;
let battleToken = 0; // incremented whenever a battle should be cancelled (e.g. Home)

function initState() {
  state = { energy: { 1: 0, 2: 0 }, turn: 1, currentPlayer: 1, choice: { 1: null, 2: null } };
}

// Show the home / title screen, cancelling any running battle.
function goHome() {
  battleToken++;          // invalidates any in-flight runBattle()
  initState();
  setActiveCard(0);
  $("turnBanner").textContent = "";
  showScreen("home");
}

// Begin a fresh game from the home screen.
function startGame() {
  battleToken++;
  initState();
  startTurn();
}

const $ = (id) => document.getElementById(id);
const screens = ["home", "passScreen", "selectScreen", "readyScreen", "battle", "result"];
function showScreen(id) {
  screens.forEach((s) => $(s).classList.toggle("show", s === id));
  // toggle home layout (hide in-game chrome on the title screen)
  $("app").classList.toggle("home-active", id === "home");
}

function renderEnergy() {
  for (const p of [1, 2]) {
    const n = state.energy[p];
    let html = "";
    for (let i = 0; i < MAX_ENERGY; i++) html += `<span class="${i < n ? "" : "empty"}">🟠</span>`;
    $("energy" + p).innerHTML = html;
  }
}

function setActiveCard(player) {
  $("card1").classList.toggle("active", player === 1);
  $("card2").classList.toggle("active", player === 2);
}

// ---- Flow ----
function startTurn() {
  state.choice = { 1: null, 2: null };
  state.currentPlayer = 1;
  renderEnergy();
  $("turnBanner").textContent = `ターン ${state.turn}`;
  goToPass(1);
}

function goToPass(player) {
  state.currentPlayer = player;
  setActiveCard(player);
  $("passPrompt").textContent = `プレイヤー${player} の番です`;
  $("passBtn").textContent = `プレイヤー${player}：アクションを選ぶ`;
  showScreen("passScreen");
}

function goToSelect(player) {
  setActiveCard(player);
  $("selectPrompt").textContent = `プレイヤー${player}：アクションを選択`;
  const container = $("actionButtons");
  container.innerHTML = "";
  for (const key of ["charge", "blast", "guard", "hadouken"]) {
    const a = ACTIONS[key];
    const btn = document.createElement("button");
    btn.className = "action";
    const canAfford = state.energy[player] >= a.cost;
    btn.disabled = !canAfford;
    btn.innerHTML = `${ICONS[key]}<span>${a.label}</span><span class="cost">${a.costLabel}</span>`;
    if (canAfford) btn.addEventListener("click", () => chooseAction(player, key));
    container.appendChild(btn);
  }
  showScreen("selectScreen");
}

function chooseAction(player, key) {
  state.choice[player] = key;
  if (player === 1) {
    goToPass(2);
  } else {
    setActiveCard(0);
    goToReady();
  }
}

// NEW: an execute/ready screen between P2's choice and the battle scene
function goToReady() {
  // show hidden silhouettes only (actions stay secret until the battle)
  $("readyFig1").innerHTML = readySilhouette("p1c");
  $("readyFig2").innerHTML = readySilhouette("p2c", true);
  showScreen("readyScreen");
}

function readySilhouette(cls, flip) {
  return `<div class="fig ${cls}" style="${flip ? "transform:scaleX(-1)" : ""}">
    <div class="part arm back"></div><div class="part leg back"></div>
    <div class="part leg front"></div><div class="part torso"></div>
    <div class="part belt"></div><div class="part head"></div>
    <div class="part arm front"></div></div>`;
}

// ---- Battle resolution ----
function resolve(a1, a2) {
  if (a1 === "hadouken" && a2 === "hadouken") return { result: "continue", kind: "clash-hado", reason: "波動拳が激突！相殺！" };
  if (a1 === "hadouken") return { result: "p1", kind: "hado", reason: "プレイヤー1の波動拳が炸裂！" };
  if (a2 === "hadouken") return { result: "p2", kind: "hado", reason: "プレイヤー2の波動拳が炸裂！" };

  if (a1 === "blast" && a2 === "blast") return { result: "continue", kind: "clash-blast", reason: "ブラストが激突！相殺！" };
  if (a1 === "blast") {
    if (a2 === "charge") return { result: "p1", kind: "blast", reason: "プレイヤー1のブラストが命中！" };
    if (a2 === "guard")  return { result: "continue", kind: "blocked", by: 2, reason: "プレイヤー2がガードで防いだ！" };
  }
  if (a2 === "blast") {
    if (a1 === "charge") return { result: "p2", kind: "blast", reason: "プレイヤー2のブラストが命中！" };
    if (a1 === "guard")  return { result: "continue", kind: "blocked", by: 1, reason: "プレイヤー1がガードで防いだ！" };
  }
  return { result: "continue", kind: "none", reason: "決着つかず。次のターンへ！" };
}

function applyCosts() {
  for (const p of [1, 2]) {
    const key = state.choice[p];
    if (key === "charge") state.energy[p] = Math.min(MAX_ENERGY, state.energy[p] + 1);
    else state.energy[p] = Math.max(0, state.energy[p] - ACTIONS[key].cost);
  }
}

// ---- Battle scene (rich choreography) ----
function poseClass(key) { return "pose-" + key; }

function delay(ms) { return new Promise((r) => setTimeout(r, ms)); }

function shakeStage() {
  const s = $("stage");
  s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
}
function flashStage() {
  const f = $("flash");
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}

function spawnProjectile(fromPlayer, kind) {
  const stage = $("stage");
  const el = document.createElement("div");
  el.className = "projectile " + (kind === "hadouken" ? "hado-ball" : "blast-ball");
  const goRight = fromPlayer === 1;
  el.style.bottom = "150px";
  el.style.animation = `${goRight ? "travelR" : "travelL"} 0.6s linear forwards`;
  stage.appendChild(el);
  return el;
}

function impactAt(rightSide) {
  const stage = $("stage");
  const el = document.createElement("div");
  el.className = "impact go";
  el.style.bottom = "130px";
  if (rightSide) el.style.right = "70px"; else el.style.left = "70px";
  stage.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

function clashText(txt) {
  const c = $("clash") || (() => {
    const e = document.createElement("div"); e.id = "clash"; e.className = "clash"; $("stage").appendChild(e); return e;
  })();
  c.textContent = txt;
  c.classList.remove("go"); void c.offsetWidth; c.classList.add("go");
}

function resetStage() {
  const stage = $("stage");
  // remove any leftover dynamic elements from a previous turn
  stage.querySelectorAll(".projectile, .impact").forEach((el) => el.remove());
  const clash = $("clash");
  if (clash) clash.remove();
  // clear lingering animation classes
  stage.classList.remove("shake");
  $("flash").classList.remove("go");
  const fw1 = $("fw1"), fw2 = $("fw2"), fig1 = $("fig1"), fig2 = $("fig2");
  fw1.className = "fighter-wrap left p1c";
  fw2.className = "fighter-wrap right p2c";
  fig1.className = "fig"; fig2.className = "fig";
  $("battleLog").textContent = "";
  $("countdown").textContent = "";
  // force reflow so removed animation classes fully reset before replay
  void stage.offsetWidth;
}

async function runBattle() {
  const myToken = battleToken;           // snapshot; if it changes, this battle was cancelled
  const cancelled = () => myToken !== battleToken;

  const a1 = state.choice[1], a2 = state.choice[2];
  showScreen("battle");
  resetStage();

  const fig1 = $("fig1"), fig2 = $("fig2");
  const cd = $("countdown");

  // Countdown 3-2-1-FIGHT
  for (const t of ["3", "2", "1", "FIGHT!"]) {
    cd.textContent = t;
    cd.classList.remove("pop"); void cd.offsetWidth; cd.classList.add("pop");
    await delay(600);
    if (cancelled()) return;
  }
  cd.textContent = "";

  // Reveal stances
  fig1.classList.add(poseClass(a1));
  fig2.classList.add(poseClass(a2));
  $("battleLog").textContent = `${ACTIONS[a1].label}　VS　${ACTIONS[a2].label}`;
  await delay(700);
  if (cancelled()) return;

  const outcome = resolve(a1, a2);
  applyCosts();
  renderEnergy();

  await playChoreography(a1, a2, outcome);
  if (cancelled()) return;

  $("battleLog").textContent = outcome.reason;
  await delay(1300);
  if (cancelled()) return;
  finishBattle(outcome);
}

async function playChoreography(a1, a2, outcome) {
  const kind = outcome.kind;

  if (kind === "clash-hado" || kind === "clash-blast") {
    // both fire, meet in the middle, explode
    const proj = kind === "clash-hado" ? "hadouken" : "blast";
    const p1 = spawnProjectile(1, proj), p2 = spawnProjectile(2, proj);
    // shorten travel so they meet mid-stage
    p1.style.animationDuration = "0.4s"; p2.style.animationDuration = "0.4s";
    p1.style.animationName = "travelRhalf"; p2.style.animationName = "travelLhalf";
    injectHalfKeyframes();
    await delay(400);
    p1.remove(); p2.remove();
    impactMid(); clashText("相殺！"); flashStage(); shakeStage();
    await delay(500);
    return;
  }

  if (kind === "hado" || kind === "blast") {
    const attacker = outcome.result === "p1" ? 1 : 2;
    const proj = kind === "hado" ? "hadouken" : "blast";
    const el = spawnProjectile(attacker, proj);
    await delay(600);
    el.remove();
    // hit the loser
    const rightSideHit = attacker === 1; // opponent is on the right
    impactAt(rightSideHit);
    flashStage(); shakeStage();
    const loserWrap = attacker === 1 ? $("fw2") : $("fw1");
    loserWrap.classList.add("knockback");
    await delay(350);
    loserWrap.classList.add("ko");
    await delay(500);
    return;
  }

  if (kind === "blocked") {
    // attacker fires, defender's shield flares
    const attacker = outcome.by === 1 ? 2 : 1;
    const el = spawnProjectile(attacker, "blast");
    await delay(600);
    el.remove();
    const rightSideHit = attacker === 1;
    impactAt(rightSideHit);
    clashText("GUARD!"); flashStage(); shakeStage();
    await delay(500);
    return;
  }

  // no interaction (e.g. charge vs charge, guard vs guard, charge vs guard)
  clashText("…");
  await delay(500);
}

function impactMid() {
  const stage = $("stage");
  const el = document.createElement("div");
  el.className = "impact go";
  el.style.bottom = "130px";
  el.style.left = "50%"; el.style.transform = "translateX(-50%)";
  el.style.width = "120px"; el.style.height = "120px";
  stage.appendChild(el);
  setTimeout(() => el.remove(), 600);
}

let halfInjected = false;
function injectHalfKeyframes() {
  if (halfInjected) return;
  const s = document.createElement("style");
  s.textContent = `
    @keyframes travelRhalf { from{left:96px} to{left:calc(50% - 24px)} }
    @keyframes travelLhalf { from{right:96px} to{right:calc(50% - 24px)} }`;
  document.head.appendChild(s);
  halfInjected = true;
}

function finishBattle(outcome) {
  if (outcome.result === "continue") { state.turn++; startTurn(); return; }
  showScreen("result");
  setActiveCard(0);
  $("turnBanner").textContent = "";
  const winner = outcome.result === "p1" ? 1 : 2;
  $("winnerText").textContent = `🏆 プレイヤー${winner} の勝ち！`;
  $("winnerText").style.color = winner === 1 ? "var(--p1)" : "var(--p2)";
  $("winnerSub").textContent = outcome.reason;
}

// ---- Events ----
$("passBtn").addEventListener("click", () => goToSelect(state.currentPlayer));
$("fightBtn").addEventListener("click", () => runBattle());
$("startBtn").addEventListener("click", () => startGame());
$("restartBtn").addEventListener("click", () => goHome());
$("homeBtn").addEventListener("click", () => goHome());

// ---- Start ----
initState();
goHome();
</script>
</body>
</html>
